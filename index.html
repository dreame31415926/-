<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机狗狗图片生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>随机狗狗图片生成器 ??</h1>
        
        <div id="image-container">
            <img id="dog-image" src="placeholder.jpg" alt="等待加载狗狗图片...">
            <p id="loading-text">点击按钮加载第一张狗狗图片...</p>
        </div>

        <button id="generate-btn">生成新的狗狗！</button>

        <p class="footer">使用了 <a href="https://dog.ceo/dog-api/" target="_blank">Dog API</a> 提供的图片。</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
